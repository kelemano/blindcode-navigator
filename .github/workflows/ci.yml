name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

# Die VS-Code-Extension liegt im Unterordner blindcode-navigator/.
defaults:
  run:
    working-directory: blindcode-navigator

jobs:
  # Schnelle Stufe: Lint, Kompilierung und Unit-Tests (ohne VS Code).
  lint-compile-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blindcode-navigator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile (TypeScript)
        run: npm run compile

      - name: Unit tests (mocha, ohne VS Code)
        run: npm run test:unit

  # Integrationstests im echten VS-Code-Host (braucht ein virtuelles Display).
  integration:
    runs-on: ubuntu-latest
    needs: lint-compile-unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blindcode-navigator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Integration tests (VS Code via xvfb)
        run: xvfb-run -a npm run test:integration
